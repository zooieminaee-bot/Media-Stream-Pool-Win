name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore MediaStreamPool.slnx

      - name: Build
        run: dotnet build MediaStreamPool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MediaStreamPool.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Windows x64 application
        run: >-
          dotnet publish src/MediaStreamPool.App/MediaStreamPool.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/MediaStreamPoolWin
          -p:WindowsAppSDKSelfContained=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package Windows x64 application
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/MediaStreamPoolWin/* -DestinationPath artifacts/MediaStreamPoolWin-win-x64.zip -Force
          Get-FileHash artifacts/MediaStreamPoolWin-win-x64.zip -Algorithm SHA256 | Format-List

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v6
        with:
          name: MediaStreamPoolWin-win-x64
          path: artifacts/MediaStreamPoolWin/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:') && success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ($env:GITHUB_EVENT_PATH | Get-Content -Raw | ConvertFrom-Json).head_commit.message -replace '^release:\s*', ''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Release version is empty.' }
          if ($version -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }

          $releaseExists = gh release view $version 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $version already exists. Skipping creation."
            exit 0
          }

          gh release create $version `
            artifacts/MediaStreamPoolWin-win-x64.zip `
            --target $env:GITHUB_SHA `
            --title "MediaStreamPool Win $version" `
            --notes "Windows x64 self-contained build of MediaStreamPool Win. Built from commit $env:GITHUB_SHA."
