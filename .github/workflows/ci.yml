name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore MediaStreamPool.slnx

      - name: Build
        run: dotnet build MediaStreamPool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MediaStreamPool.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Windows x64 application
        run: >-
          dotnet publish src/MediaStreamPool.App/MediaStreamPool.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/MediaStreamPoolWin
          -p:WindowsAppSDKSelfContained=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v6
        with:
          name: MediaStreamPoolWin-win-x64
          path: artifacts/MediaStreamPoolWin/
          if-no-files-found: error
          retention-days: 14
